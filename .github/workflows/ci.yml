name: CI Workflow

on:
  push:
    branches:
    - main
  pull_request:
jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
          cdn.playwright.dev:443
          playwright.download.prss.microsoft.com:443
          storage.googleapis.com:443
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'

    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
      with:
        r-version: 'release'

    - name: Pre-install R package dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y r-cran-jsonlite r-cran-digest

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Linting
      run: pnpm run lint

    - name: Build and Enforce Bundle Budgets
      run: pnpm run build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    - name: Run Unit Tests
      run: pnpm test --watch=false

    - name: Archive environment
      run: tar -cf shared-env.tar node_modules pw-browsers dist

    - name: Upload shared environment
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      with:
        name: shared-env
        path: shared-env.tar
        retention-days: 1

    permissions:
      contents: read
  e2e:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Download shared environment
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: shared-env
        path: .

    - name: Extract shared environment
      run: tar -xf shared-env.tar

    - name: Install Playwright runtime dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwoff1
        npx playwright install-deps
      env:
        CI: true
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    - name: Run E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal 
        }})
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ 
        matrix.shardTotal }}
      env:
        CI: true
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    - name: Upload blob report
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      if: always()
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report/
        retention-days: 1

  code_generation_fixtures:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'

    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
      with:
        r-version: 'release'

    - name: Download shared environment
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: shared-env
        path: .

    - name: Extract shared environment
      run: tar -xf shared-env.tar

    - name: Install Playwright WebKit runtime libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libwoff1
        npx playwright install --with-deps webkit
      env:
        CI: true
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    - name: Export code-generation fixture scripts
      run: npx playwright test tests_e2e/code-generation-fixture.spec.ts --project=webkit
      env:
        CI: true
        CODEGEN_FIXTURES: '1'
        PYTHON: python
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    - name: Upload code-generation fixture scripts
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      if: always()
      with:
        name: code-generation-fixtures
        path: artifacts/code-generation-fixtures/
        retention-days: 30

  python_script_execution_check:
    runs-on: ubuntu-latest
    needs: code_generation_fixtures
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'

    - name: Download code-generation fixture scripts
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: code-generation-fixtures
        path: artifacts/code-generation-fixtures/

    - name: Execute generated Python scripts
      run: |
        set -e
        PASS=0
        FAIL=0
        ERRORS=""
        echo "=== Running UI-generated Python scripts ==="
        while IFS= read -r -d '' script; do
          echo ""
          echo "--- Running: $script ---"
          if python "$script"; then
            echo "PASS: $script"
            PASS=$((PASS + 1))
          else
            echo "FAIL: $script"
            FAIL=$((FAIL + 1))
            ERRORS="$ERRORS\n  ✗ $script"
          fi
        done < <(find artifacts/code-generation-fixtures -name '*.py' -print0 | sort -z)
        echo ""
        echo "=== Python Script Execution Summary ==="
        echo "  Passed: $PASS"
        echo "  Failed: $FAIL"
        if [ "$FAIL" -gt 0 ]; then
          echo ""
          echo "FAILED scripts:"
          printf '%b\n' "$ERRORS"
          exit 1
        fi
        if [ "$PASS" -eq 0 ]; then
          echo "ERROR: No Python scripts found in artifacts/code-generation-fixtures/"
          exit 1
        fi
        echo "All $PASS generated Python script(s) executed successfully."

  sas_static_validation:
    runs-on: ubuntu-latest
    needs: code_generation_fixtures
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Download shared environment
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: shared-env
        path: .

    - name: Extract shared environment
      run: tar -xf shared-env.tar

    - name: Download code-generation fixture scripts
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: code-generation-fixtures
        path: artifacts/code-generation-fixtures/

    - name: Run SAS static syntax validator
      run: npx tsx scripts/validate-sas-syntax.mjs

  stata_static_validation:
    runs-on: ubuntu-latest
    needs: code_generation_fixtures
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Download shared environment
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: shared-env
        path: .

    - name: Extract shared environment
      run: tar -xf shared-env.tar

    - name: Download code-generation fixture scripts
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: code-generation-fixtures
        path: artifacts/code-generation-fixtures/

    - name: Run Stata static syntax validator
      run: npx tsx scripts/validate-stata-syntax.mjs

  metadata_validation:
    runs-on: ubuntu-latest
    needs: code_generation_fixtures
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Download code-generation fixture scripts
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: code-generation-fixtures
        path: artifacts/code-generation-fixtures/

    - name: Run metadata validation
      run: node scripts/validate-metadata.mjs

  adr_validation:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443

    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Download shared environment
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: shared-env
        path: .

    - name: Extract shared environment
      run: tar -xf shared-env.tar

    - name: Run ADR validation
      run: node scripts/validate-adr.js

  merge_reports:
    runs-on: ubuntu-latest
    needs: e2e
    if: "!cancelled() && needs.e2e.result != 'skipped'"
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Download shared environment
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: shared-env
        path: .

    - name: Extract shared environment
      run: tar -xf shared-env.tar

    - name: Download all blob reports
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true

    - name: Merge Playwright reports
      run: |
        npx playwright merge-reports --reporter html ./all-blob-reports
        mkdir -p playwright-report
        npx playwright merge-reports --reporter json ./all-blob-reports > playwright-report/report.json

    - name: Upload merged HTML report
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  traceability_matrix:
    runs-on: ubuntu-latest
    needs: [setup, merge_reports, python_script_execution_check, sas_static_validation, stata_static_validation, metadata_validation, adr_validation, cross_env_equivalence, sbom, security_scan, lint_actions]
    if: "!cancelled() && needs.setup.result == 'success'"
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
          pypi.org:443
          files.pythonhosted.org:443
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'

    - name: Download shared environment
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: shared-env
        path: .

    - name: Extract shared environment
      run: tar -xf shared-env.tar

    - name: Run unit tests with JSON reporter
      run: |
        ./node_modules/.bin/vitest run \
          --exclude 'tests_e2e/**' \
          --reporter=json \
          --outputFile=vitest-results.json || true

    - name: Download Playwright JSON report
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: playwright-report
        path: playwright-report/
      continue-on-error: true

    - name: Generate Validation Traceability Matrix
      run: |
        cat << 'EOF' > job-statuses.json
        {
          "python_script_execution_check": "${{ needs.python_script_execution_check.result }}",
          "sas_static_validation": "${{ needs.sas_static_validation.result }}",
          "stata_static_validation": "${{ needs.stata_static_validation.result }}",
          "cross_env_equivalence": "${{ needs.cross_env_equivalence.result }}",
          "sbom": "${{ needs.sbom.result }}",
          "security_scan": "${{ needs.security_scan.result }}",
          "lint_actions": "${{ needs.lint_actions.result }}"
        }
        EOF
        VITEST_ARG=""
        PW_ARG=""
        if [ -f vitest-results.json ]; then
          VITEST_ARG="--vitest-results vitest-results.json"
        fi
        if [ -f playwright-report/report.json ]; then
          PW_ARG="--playwright-results playwright-report/report.json"
        fi
        node scripts/generate-rtm.mjs "$VITEST_ARG" "$PW_ARG" \
          --ci-results job-statuses.json \
          --out Validation_Traceability_Matrix.md
        echo "=== Traceability Matrix (first 50 lines) ==="
        head -50 Validation_Traceability_Matrix.md

    - name: Upload Validation Traceability Matrix
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      with:
        name: validation-traceability-matrix
        path: Validation_Traceability_Matrix.md
        retention-days: 90

  script_validation_report:
    runs-on: ubuntu-latest
    needs: [python_script_execution_check, sas_static_validation, 
        stata_static_validation, cross_env_equivalence]
    if: "!cancelled()"
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Download code-generation fixture scripts
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: code-generation-fixtures
        path: artifacts/code-generation-fixtures/
      continue-on-error: true

    - name: Generate script validation report
      run: |
        node scripts/generate-script-validation-report.mjs \
          --python-result "${{ needs.python_script_execution_check.result }}" \
          --r-result      "${{ needs.cross_env_equivalence.result }}" \
          --sas-result    "${{ needs.sas_static_validation.result }}" \
          --stata-result  "${{ needs.stata_static_validation.result }}" \
          --fixture-root  artifacts/code-generation-fixtures \
          --out           script-validation-report.md
        echo "=== Script Validation Report (preview) ==="
        head -40 script-validation-report.md

    - name: Upload script validation report
      uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
      if: always()
      with:
        name: script-validation-report
        path: script-validation-report.md
        retention-days: 90

  cross_env_equivalence:
    runs-on: ubuntu-latest
    needs: [setup, code_generation_fixtures]
    permissions:
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'

    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
      with:
        r-version: 'release'

    - name: Download code-generation fixture scripts
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: code-generation-fixtures
        path: artifacts/code-generation-fixtures/

    - name: Python Cross-Environment Equivalence Check
      run: |
        echo "Running Python cross-environment equivalence fixture..."
        python scripts/cross-env/verify_python_schema.py
        echo "Python equivalence check completed."

    - name: R Cross-Environment Equivalence Check
      run: |
        echo "Running R cross-environment equivalence fixture and generated-script execution checks..."
        Rscript scripts/cross-env/verify_r_schema.R artifacts/code-generation-fixtures
