      run: pnpm install --frozen-lockfile

    - name: Download SBOM artifact
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: sbom
        path: .

    - name: Generate Build Provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      id: provenance
      with:
        subject-path: 'sbom.json'

    - name: Copy Provenance for Release
      run: cp ${{ steps.provenance.outputs.bundle-path }} ./build-provenance.intoto.jsonl

    - name: Generate SBOM Attestation
      uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6
      id: sbom_attest
      with:
        subject-path: 'sbom.json'
        sbom-path: 'sbom.json'

    - name: Copy SBOM Attestation for Release
      run: cp ${{ steps.sbom_attest.outputs.bundle-path }} ./sbom-attestation.intoto.jsonl

    - name: Run semantic-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx semantic-release

