    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Run actionlint
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl -sL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
        tar xf actionlint.tar.gz actionlint
        ./actionlint -color
    - name: Check for mutable tags
      run: |
        if grep -rnE 'uses: .*@[vV][0-9]' .github/workflows/; then
          echo "ERROR: Mutable action tags detected. Use SHA-256 hashes instead of tags (e.g., @v1)."
          exit 1
        fi
        echo "All actions are pinned to SHAs."


