  security_scan:
    runs-on: ubuntu-latest
    needs: code_generation_fixtures
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Download code-generation fixture scripts
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: code-generation-fixtures
        path: artifacts/code-generation-fixtures/

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'

    - name: Install Semgrep
      run: pip install semgrep

    - name: Run Polyglot Security Scan
      run: |
        mkdir -p artifacts/
        semgrep scan --config p/default \
                     --config .semgrep/rules.yml \
                     --exclude="*.html" \
                     --error \
                     --sarif --output=semgrep.sarif \
                     src/ artifacts/

    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3
      if: always()
      with:
        sarif_file: semgrep.sarif
        category: semgrep
  deploy_preview:
    runs-on: ubuntu-latest
    needs: setup
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
      with:
        egress-policy: audit
        allowed-endpoints: |-
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          registry.npmjs.org:443
          registry.yarnpkg.com:443
          nodejs.org:443
          api.cloudflare.com:443
          *.blob.core.windows.net:443
          *.actions.githubusercontent.com:443
          playwright.azureedge.net:443
          archive.ubuntu.com:80
          security.ubuntu.com:80
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Set up Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: '22'

    - name: Download shared environment
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e
      with:
        name: shared-env
        path: .

    - name: Extract shared environment
      run: tar -xf shared-env.tar

    - name: Deploy to Cloudflare Workers Preview
      id: deploy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "Cloudflare secrets are not available. Skipping deployment."
          echo "url=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        set +e
        OUTPUT=$(npx wrangler deploy --name "equipose-pr-${{ github.event.pull_request.number }}" 2>&1)
        EXIT_CODE=$?
        set -e
        echo "$OUTPUT"
        if [ $EXIT_CODE -ne 0 ]; then
          echo "Wrangler deploy failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi
        OUTPUT_CLEAN=$(echo "$OUTPUT" | sed -r 's/\x1b\[[0-9;]*[mK]//g')
        URL=$(echo "$OUTPUT_CLEAN" | grep -o 'https://[^ ]*\.workers\.dev' | head -1 || true)
        if [ -z "$URL" ]; then URL="Deployment URL not found in output"; fi
        echo "url=$URL" >> "$GITHUB_OUTPUT"

    - name: Validate Cache Headers
      if: steps.deploy.outputs.url != 'skipped' && steps.deploy.outputs.url != ''
      run: npx tsx scripts/validate-headers.ts --url "${{ steps.deploy.outputs.url }}"

    - name: Comment on PR
      if: steps.deploy.outputs.url != 'skipped' && steps.deploy.outputs.url != ''
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: |
          const body = `🚀 PR Preview deployed!\n\n🌐 View here: ${{ steps.deploy.outputs.url }}`;
          const comments = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          const existing = comments.data.find(c => c.body.includes('🚀 PR Preview deployed!'));
          if (existing) {
            await github.rest.issues.updateComment({
              comment_id: existing.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }
  lint_actions:
